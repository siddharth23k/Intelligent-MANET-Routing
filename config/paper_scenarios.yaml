# Scenario parameters from the base paper, plus our own evaluation settings.
# Anything both methods must agree on belongs here and nowhere else.

paper_reference:
  simulator: ns-3
  area_m: [1000, 1000]
  mobility_model: random_waypoint
  traffic: cbr
  packet_size_bytes: [500, 512]
  communication_radius_m: [150, 200, 250]
  node_counts: [50, 80, 100, 200, 300, 400, 500]
  mobility_speeds_mps: [0, 5, 15, 20, 30, 45, 60]
  rounds: [200, 400, 600, 800, 1000]

evaluation_defaults:
  random_seed: 42
  test_run_count: 6
  val_run_count: 4          # carved out of the training runs, never out of test
  pairs_per_step: 5
  radius_m: 150.0
  hello_interval_s: 1.0

labels:
  # Failure at time t if, horizon_steps later, the node lost neighbour_drop
  # neighbours, or mean RSSI fell rssi_drop_db, or it became isolated.
  horizon_steps: 5
  neighbour_drop: 2
  rssi_drop_db: 15.0
  rssi_sentinel: -1000.0    # value the simulation writes for an isolated node
  rssi_floor_db: -95.0      # sentinel is replaced with this before modelling

survival:
  # Ground truth routing metric: a path chosen at t survives if every hop is
  # still within radius at t + horizon_steps. Measured from the mobility trace.
  horizon_steps: 5

training:
  rf_estimators: 100
  rf_max_depth: 10
  xgb_estimators: 300
  xgb_max_depth: 5
  xgb_learning_rate: 0.05
  xgb_early_stopping_rounds: 20
  sfrnnr_epochs: 30
  sfrnnr_patience: 4
  sfrnnr_gru_units: 16
  sfrnnr_rule_units: 8
  sfrnnr_n_mfs: 2
  sfrnnr_batch_size: 64

smoke:
  # Used by --smoke everywhere. Sized to prove the chain executes, not to
  # produce meaningful numbers.
  max_runs: 6
  test_run_count: 2
  val_run_count: 1
  max_rows_per_run: 3000
  snapshots_per_run: 4
  pairs_per_step: 2
  rf_estimators: 12
  rf_max_depth: 6
  xgb_estimators: 12
  xgb_max_depth: 4
  sfrnnr_epochs: 2
  sfrnnr_max_train_sequences: 64
  sfrnnr_seq_len: 24
  sfrnnr_batch_size: 32
